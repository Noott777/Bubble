<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bubble — Social Graph</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #07080f;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      color: #e0e6f0;
      height: 100vh;
      width: 100vw;
    }

    /* ── top bar ── */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: rgba(12,14,26,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 14px;
      z-index: 100;
    }
    #topbar .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #6eb5ff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #topbar .tagline {
      font-size: 12px;
      color: #555e7a;
      flex: 1;
    }
    #search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    #search-wrap svg {
      position: absolute;
      left: 10px;
      opacity: 0.4;
    }
    #search {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 6px 14px 6px 32px;
      color: #e0e6f0;
      font-size: 13px;
      width: 180px;
      outline: none;
      transition: border-color 0.2s, width 0.3s;
    }
    #search:focus { border-color: #6eb5ff55; width: 220px; }
    #search::placeholder { color: #555e7a; }

    /* ── legend ── */
    #legend {
      position: fixed;
      bottom: 24px;
      left: 24px;
      background: rgba(12,14,26,0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 12px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .legend-item { display: flex; align-items: center; gap: 9px; color: #8891aa; }
    .legend-dot {
      width: 11px; height: 11px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── canvas ── */
    #canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    /* ── chat panel ── */
    #chat-panel {
      position: fixed;
      right: -360px;
      top: 52px;
      bottom: 0;
      width: 340px;
      background: rgba(10,12,22,0.96);
      backdrop-filter: blur(16px);
      border-left: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      transition: right 0.35s cubic-bezier(0.4,0,0.2,1);
      z-index: 200;
    }
    #chat-panel.open { right: 0; }

    #chat-header {
      padding: 16px 18px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #chat-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      font-weight: 700;
      flex-shrink: 0;
    }
    #chat-name { font-size: 15px; font-weight: 600; }
    #chat-sub  { font-size: 11px; color: #555e7a; margin-top: 2px; }
    #chat-close {
      margin-left: auto;
      background: none;
      border: none;
      color: #555e7a;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }
    #chat-close:hover { color: #e0e6f0; background: rgba(255,255,255,0.08); }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #chat-messages::-webkit-scrollbar { width: 4px; }
    #chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .msg {
      max-width: 76%;
      padding: 8px 13px;
      border-radius: 16px;
      font-size: 13.5px;
      line-height: 1.5;
      animation: fadeUp 0.2s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.them {
      background: rgba(255,255,255,0.08);
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      color: #d8dff0;
    }
    .msg.me {
      background: linear-gradient(135deg, #3b6fd4, #6940c4);
      border-bottom-right-radius: 4px;
      align-self: flex-end;
      color: #fff;
    }
    .msg-time { font-size: 10px; opacity: 0.45; margin-top: 3px; }

    #chat-input-wrap {
      padding: 12px 14px;
      border-top: 1px solid rgba(255,255,255,0.07);
      display: flex;
      gap: 9px;
      align-items: flex-end;
    }
    #chat-input {
      flex: 1;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 9px 13px;
      color: #e0e6f0;
      font-size: 13px;
      outline: none;
      resize: none;
      font-family: inherit;
      line-height: 1.4;
      max-height: 100px;
      transition: border-color 0.2s;
    }
    #chat-input:focus { border-color: #6eb5ff44; }
    #chat-input::placeholder { color: #454d66; }
    #send-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #3b6fd4, #6940c4);
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.15s;
    }
    #send-btn:hover { opacity: 0.85; transform: scale(1.07); }

    /* ── tooltip ── */
    #tooltip {
      position: fixed;
      background: rgba(10,12,22,0.92);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 9px;
      padding: 8px 13px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 150;
      white-space: nowrap;
    }
    #tooltip.show { opacity: 1; }
    #tooltip .tt-name { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
    #tooltip .tt-info { color: #778; }
  </style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <div class="logo">bubble</div>
  <div class="tagline">your social universe</div>
  <div id="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e0e6f0" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="search" type="text" placeholder="Search connections…" />
  </div>
</div>

<!-- Canvas -->
<canvas id="canvas"></canvas>

<!-- Legend -->
<div id="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#6eb5ff;box-shadow:0 0 6px #6eb5ff80"></div> You</div>
  <div class="legend-item"><div class="legend-dot" style="background:#a78bfa;box-shadow:0 0 6px #a78bfa80"></div> Friend (frequent)</div>
  <div class="legend-item"><div class="legend-dot" style="background:#64748b;box-shadow:0 0 4px #64748b80"></div> Friend (occasional)</div>
  <div class="legend-item"><div class="legend-dot" style="background:#34d399;box-shadow:0 0 6px #34d39980"></div> Group chat</div>
  <div class="legend-item" style="margin-top:2px">
    <svg width="11" height="11" viewBox="0 0 11 11" style="flex-shrink:0">
      <line x1="0" y1="5.5" x2="11" y2="5.5" stroke="#6eb5ff" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.6"/>
    </svg>
    Closer = more messages
  </div>
</div>

<!-- Tooltip -->
<div id="tooltip">
  <div class="tt-name" id="tt-name"></div>
  <div class="tt-info" id="tt-info"></div>
</div>

<!-- Chat panel -->
<div id="chat-panel">
  <div id="chat-header">
    <div id="chat-avatar"></div>
    <div>
      <div id="chat-name"></div>
      <div id="chat-sub"></div>
    </div>
    <button id="chat-close">×</button>
  </div>
  <div id="chat-messages"></div>
  <div id="chat-input-wrap">
    <textarea id="chat-input" rows="1" placeholder="Message…"></textarea>
    <button id="send-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<script>
// ── Data ─────────────────────────────────────────────────────────────────────
const ME = { id: 'me', label: 'You', type: 'me' };

const NODES = [
  // type: 'friend' — frequency 0–1 controls distance (1 = closest)
  { id: 'alex',    label: 'Alex',     type: 'friend', freq: 0.92, color: '#a78bfa', avatar: 'A',
    messages: [
      { from: 'them', text: 'Yo what are you up to tonight?', t: '8:12 PM' },
      { from: 'me',   text: 'Nothing much, maybe a movie?', t: '8:14 PM' },
      { from: 'them', text: 'Let\'s do it! I\'ll bring snacks 🍿', t: '8:15 PM' },
    ]
  },
  { id: 'sam',     label: 'Sam',      type: 'friend', freq: 0.85, color: '#f472b6', avatar: 'S',
    messages: [
      { from: 'them', text: 'Did you see that new album drop?', t: '3:40 PM' },
      { from: 'me',   text: 'Not yet! Is it good?', t: '3:45 PM' },
      { from: 'them', text: 'It\'s incredible honestly', t: '3:46 PM' },
    ]
  },
  { id: 'jordan',  label: 'Jordan',   type: 'friend', freq: 0.78, color: '#fb923c', avatar: 'J',
    messages: [
      { from: 'me',   text: 'Hey did you finish that project?', t: '10:00 AM' },
      { from: 'them', text: 'Almost! Just need to clean up the code', t: '10:22 AM' },
    ]
  },
  { id: 'taylor',  label: 'Taylor',   type: 'friend', freq: 0.55, color: '#38bdf8', avatar: 'T',
    messages: [
      { from: 'them', text: 'Long time no talk! How are you?', t: 'Yesterday' },
      { from: 'me',   text: 'Doing well! Been super busy', t: 'Yesterday' },
    ]
  },
  { id: 'casey',   label: 'Casey',    type: 'friend', freq: 0.40, color: '#a78bfa', avatar: 'C',
    messages: [
      { from: 'me',   text: 'Happy birthday!! 🎉', t: 'Mar 12' },
      { from: 'them', text: 'Thanks!! You remembered 😊', t: 'Mar 12' },
    ]
  },
  { id: 'morgan',  label: 'Morgan',   type: 'friend', freq: 0.28, color: '#64748b', avatar: 'M',
    messages: [
      { from: 'them', text: 'We should catch up soon', t: 'Feb 20' },
    ]
  },
  { id: 'river',   label: 'River',    type: 'friend', freq: 0.18, color: '#64748b', avatar: 'R',
    messages: [
      { from: 'me',   text: 'Hey, are you coming to the event?', t: 'Feb 5' },
    ]
  },

  // type: 'group' — always green
  { id: 'g-devs',  label: 'Dev Squad',    type: 'group', freq: 0.88, color: '#34d399', avatar: '#',
    members: ['Alex', 'Sam', 'Jordan'],
    messages: [
      { from: 'them', text: 'Alex: Anyone free for a code review?', t: '2:10 PM' },
      { from: 'them', text: 'Sam: I can jump on in 20', t: '2:12 PM' },
      { from: 'me',   text: 'Same, give me a bit', t: '2:15 PM' },
    ]
  },
  { id: 'g-crew',  label: 'Weekend Crew', type: 'group', freq: 0.70, color: '#34d399', avatar: '#',
    members: ['Alex', 'Taylor', 'Casey', 'Morgan'],
    messages: [
      { from: 'them', text: 'Taylor: Saturday plans?', t: 'Fri 9 PM' },
      { from: 'them', text: 'Casey: Beach day! ☀️', t: 'Fri 9:02 PM' },
      { from: 'me',   text: 'I\'m so down', t: 'Fri 9:05 PM' },
    ]
  },
  { id: 'g-fam',   label: 'Family',       type: 'group', freq: 0.45, color: '#34d399', avatar: '#',
    members: ['Mom', 'Dad', 'Sibling'],
    messages: [
      { from: 'them', text: 'Mom: Coming for dinner Sunday?', t: 'Thursday' },
      { from: 'me',   text: 'Yes! I\'ll bring dessert', t: 'Thursday' },
    ]
  },
];

// ── Canvas setup ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  computePositions();
}
window.addEventListener('resize', resize);

// ── Node positions ────────────────────────────────────────────────────────────
const nodeRadius = { me: 22, friend: 0, group: 0 }; // dynamic below
const positions  = {};  // id → {x, y, r, node}

function computePositions() {
  const maxR = Math.min(W, H) * 0.40;

  // center
  positions['me'] = { x: cx, y: cy, r: 22, node: ME };

  // distribute by type in separate angular zones to avoid overlap
  const friends = NODES.filter(n => n.type === 'friend');
  const groups  = NODES.filter(n => n.type === 'group');

  // friends spread across 220° left arc, groups on 140° right arc
  friends.forEach((n, i) => {
    const angle  = (Math.PI * 0.8) + (i / Math.max(friends.length - 1, 1)) * Math.PI * 1.5;
    const dist   = maxR * (1 - n.freq * 0.72 + 0.10);
    const radius = 8 + n.freq * 9;
    positions[n.id] = {
      x: cx + Math.cos(angle) * dist,
      y: cy + Math.sin(angle) * dist,
      r: radius,
      node: n,
    };
  });

  groups.forEach((n, i) => {
    const angle  = -(Math.PI * 0.25) + (i / Math.max(groups.length - 1, 1)) * Math.PI * 0.7;
    const dist   = maxR * (1 - n.freq * 0.60 + 0.10);
    const radius = 11 + n.freq * 7;
    positions[n.id] = {
      x: cx + Math.cos(angle) * dist,
      y: cy + Math.sin(angle) * dist,
      r: radius,
      node: n,
    };
  });
}

// ── Animation state ───────────────────────────────────────────────────────────
let tick = 0;
let hoveredId = null;
let selectedId = null;

// ── Draw helpers ──────────────────────────────────────────────────────────────
function glowCircle(x, y, r, color, alpha = 0.25, spread = 2.5) {
  const g = ctx.createRadialGradient(x, y, r * 0.4, x, y, r * spread);
  g.addColorStop(0, color.replace(')', `,${alpha})`).replace('rgb', 'rgba'));
  g.addColorStop(1, 'transparent');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r * spread, 0, Math.PI * 2);
  ctx.fill();
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgb(${r},${g},${b})`;
}

function drawEdge(x1, y1, x2, y2, color, alpha, width) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth   = width;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}

function drawNode(id, pulse = false) {
  const p = positions[id];
  if (!p) return;
  const { x, y, r, node } = p;
  const isHovered  = hoveredId  === id;
  const isSelected = selectedId === id;
  const scale = isHovered || isSelected ? 1.18 : 1;
  const rr    = r * scale;
  const color = node.type === 'me'    ? '#6eb5ff'
               : node.type === 'group' ? '#34d399'
               : node.color;
  const rgb   = hexToRgb(color);

  // outer glow
  glowCircle(x, y, rr, rgb, isHovered ? 0.35 : 0.18, isHovered ? 3 : 2.5);

  // pulse ring for 'me'
  if (node.type === 'me') {
    const pr = rr + 10 + Math.sin(tick * 0.04) * 5;
    ctx.save();
    ctx.globalAlpha = 0.15 + 0.08 * Math.sin(tick * 0.04);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, pr, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // circle body
  const grad = ctx.createRadialGradient(x - rr*0.3, y - rr*0.3, rr*0.1, x, y, rr);
  const bright = color;
  grad.addColorStop(0, bright + 'ff');
  grad.addColorStop(0.7, color + 'cc');
  grad.addColorStop(1, color + '88');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, rr, 0, Math.PI * 2);
  ctx.fill();

  // border ring
  ctx.save();
  ctx.globalAlpha = isSelected ? 0.9 : 0.45;
  ctx.strokeStyle = color;
  ctx.lineWidth = isSelected ? 2.5 : 1.5;
  ctx.beginPath();
  ctx.arc(x, y, rr, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // label
  const label = node.label;
  ctx.save();
  ctx.globalAlpha = isHovered || isSelected ? 1 : 0.75;
  ctx.font = `${node.type === 'me' ? 600 : 500} ${node.type === 'me' ? 13 : 11}px 'Segoe UI', system-ui`;
  ctx.fillStyle = '#e0e6f0';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.shadowColor = '#07080f';
  ctx.shadowBlur  = 6;
  ctx.fillText(label, x, y + rr + 5);
  ctx.restore();

  // avatar initial (group shows #, others show initial)
  ctx.save();
  ctx.font = `700 ${Math.max(9, rr * 0.6)}px 'Segoe UI', system-ui`;
  ctx.fillStyle = node.type === 'me' ? '#07080f' : 'rgba(255,255,255,0.9)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(node.type === 'group' ? '⬤⬤' : (node.avatar || label[0]), x, y + 0.5);
  ctx.restore();
}

// ── Web lines ─────────────────────────────────────────────────────────────────
function drawWeb() {
  const me = positions['me'];
  Object.values(positions).forEach(p => {
    if (p.node.id === 'me') return;
    const n = p.node;
    const alpha  = 0.08 + n.freq * 0.22;
    const width  = 0.5 + n.freq * 1.5;
    const color  = n.type === 'group' ? '#34d399' : (n.color || '#a78bfa');
    const isActive = hoveredId === n.id || selectedId === n.id;

    // dashed faint web line
    ctx.save();
    ctx.globalAlpha = isActive ? alpha * 3 : alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth   = isActive ? width * 2 : width;
    ctx.setLineDash(isActive ? [] : [4, 8]);
    ctx.beginPath();
    ctx.moveTo(me.x, me.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.restore();
  });

  // group → member lines (faint secondary web)
  NODES.filter(n => n.type === 'group').forEach(g => {
    const gp = positions[g.id];
    if (!gp) return;
    NODES.filter(n => n.type === 'friend').slice(0, 3).forEach(f => {
      const fp = positions[f.id];
      if (!fp) return;
      ctx.save();
      ctx.globalAlpha = 0.04;
      ctx.strokeStyle = '#34d399';
      ctx.lineWidth = 0.5;
      ctx.setLineDash([2, 12]);
      ctx.beginPath();
      ctx.moveTo(gp.x, gp.y);
      ctx.lineTo(fp.x, fp.y);
      ctx.stroke();
      ctx.restore();
    });
  });
}

// ── Background stars ──────────────────────────────────────────────────────────
const stars = Array.from({length: 120}, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 1.2 + 0.3,
  a: Math.random() * 0.4 + 0.1,
  speed: Math.random() * 0.002 + 0.0005,
}));

function drawStars() {
  stars.forEach(s => {
    s.a += Math.sin(tick * s.speed) * 0.003;
    ctx.save();
    ctx.globalAlpha = Math.max(0.05, Math.min(0.5, s.a));
    ctx.fillStyle = '#c0ccff';
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

// ── Main render loop ──────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);
  tick++;

  drawStars();
  drawWeb();

  // draw non-selected nodes first
  const allIds = ['me', ...NODES.map(n => n.id)];
  allIds.filter(id => id !== hoveredId && id !== selectedId).forEach(drawNode);
  if (selectedId && selectedId !== hoveredId) drawNode(selectedId, true);
  if (hoveredId) drawNode(hoveredId, true);

  requestAnimationFrame(draw);
}

// ── Interaction ───────────────────────────────────────────────────────────────
function getNodeAt(mx, my) {
  // check in reverse so top-drawn nodes respond first
  const ids = ['me', ...NODES.map(n => n.id)].reverse();
  for (const id of ids) {
    const p = positions[id];
    if (!p) continue;
    const d = Math.hypot(mx - p.x, my - p.y);
    if (d <= p.r * 1.4) return id;
  }
  return null;
}

const tooltip  = document.getElementById('tooltip');
const ttName   = document.getElementById('tt-name');
const ttInfo   = document.getElementById('tt-info');

canvas.addEventListener('mousemove', e => {
  const id = getNodeAt(e.clientX, e.clientY);
  hoveredId = id;
  canvas.style.cursor = id ? 'pointer' : 'default';

  if (id && id !== 'me') {
    const node = positions[id].node;
    ttName.textContent = node.label;
    ttInfo.textContent = node.type === 'group'
      ? `Group · ${node.members?.length ?? 0} members`
      : `${Math.round(node.freq * 100)}% message frequency`;
    tooltip.classList.add('show');
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top  = (e.clientY - 10) + 'px';
  } else {
    tooltip.classList.remove('show');
  }
});

canvas.addEventListener('mouseleave', () => {
  hoveredId = null;
  tooltip.classList.remove('show');
});

canvas.addEventListener('click', e => {
  const id = getNodeAt(e.clientX, e.clientY);
  if (id && id !== 'me') {
    selectedId = id;
    openChat(positions[id].node);
  } else if (!id) {
    selectedId = null;
    closeChat();
  }
});

// ── Chat panel ────────────────────────────────────────────────────────────────
const panel     = document.getElementById('chat-panel');
const chatAvt   = document.getElementById('chat-avatar');
const chatName  = document.getElementById('chat-name');
const chatSub   = document.getElementById('chat-sub');
const chatMsgs  = document.getElementById('chat-messages');
const chatInput = document.getElementById('chat-input');
const sendBtn   = document.getElementById('send-btn');

function openChat(node) {
  chatName.textContent = node.label;
  chatSub.textContent  = node.type === 'group'
    ? `${node.members?.join(', ') ?? ''}`
    : node.freq >= 0.7 ? 'Active recently' : 'Tap to message';

  const color = node.type === 'group' ? '#34d399'
               : node.type === 'me'   ? '#6eb5ff'
               : node.color;
  chatAvt.style.background = `linear-gradient(135deg, ${color}55, ${color}22)`;
  chatAvt.style.color      = color;
  chatAvt.style.border     = `1.5px solid ${color}66`;
  chatAvt.textContent      = node.type === 'group' ? '#' : (node.avatar || node.label[0]);

  chatMsgs.innerHTML = '';
  (node.messages || []).forEach(m => addMessage(m.from, m.text, m.t, false));
  chatMsgs.scrollTop = chatMsgs.scrollHeight;

  panel.classList.add('open');
  chatInput.focus();
}

function closeChat() {
  panel.classList.remove('open');
  selectedId = null;
}

function addMessage(from, text, time, animate = true) {
  const div = document.createElement('div');
  div.className = `msg ${from === 'me' ? 'me' : 'them'}`;
  div.innerHTML = `${text}<div class="msg-time">${time}</div>`;
  if (!animate) div.style.animation = 'none';
  chatMsgs.appendChild(div);
  chatMsgs.scrollTop = chatMsgs.scrollHeight;
}

function sendMessage() {
  const text = chatInput.value.trim();
  if (!text) return;
  const now = new Date();
  const t   = now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0') + ' ' + (now.getHours() >= 12 ? 'PM' : 'AM');
  addMessage('me', text, t);
  chatInput.value = '';
  chatInput.style.height = 'auto';

  // simulate reply after short delay
  if (selectedId) {
    const node = positions[selectedId]?.node;
    const replies = [
      'haha yeah totally',
      'for sure!',
      '👍',
      'omg same',
      'let\'s talk later',
      'sending you good vibes ✨',
      'that\'s so real',
    ];
    setTimeout(() => {
      addMessage('them', replies[Math.floor(Math.random() * replies.length)], 'just now');
    }, 800 + Math.random() * 1200);
  }
}

sendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 100) + 'px';
});

document.getElementById('chat-close').addEventListener('click', closeChat);

// ── Search highlight ──────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  hoveredId = null;
  if (!q) return;
  const match = NODES.find(n => n.label.toLowerCase().includes(q));
  if (match) hoveredId = match.id;
});

// ── Boot ──────────────────────────────────────────────────────────────────────
resize();
draw();
</script>
</body>
</html>
