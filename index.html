<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Bubble</title>
<style>
:root {
  --bg: #080810;
  --surface: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.10);
  --text: #ffffff;
  --text-muted: rgba(255,255,255,0.45);
  --accent: #7c6fff;
  --nav-bg: rgba(8,8,16,0.92);
}
[data-theme="light"] {
  --bg: #f0f0f8;
  --surface: rgba(0,0,0,0.05);
  --border: rgba(0,0,0,0.10);
  --text: #0a0a14;
  --text-muted: rgba(0,0,0,0.40);
  --accent: #5b4fff;
  --nav-bg: rgba(240,240,248,0.92);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;transition:background .3s;}

/* ── Header ── */
#header {
  position:fixed;top:0;left:0;right:0;height:56px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;
  background:var(--nav-bg);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  z-index:50;
}
.logo {
  font-size:22px;font-weight:800;letter-spacing:-0.5px;
  background:linear-gradient(135deg,#a78bfa,#60a5fa,#34d399);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.hdr-icons{display:flex;gap:10px;align-items:center;}
.icon-btn {
  width:34px;height:34px;border-radius:50%;
  background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text);transition:background .2s;flex-shrink:0;
}
.icon-btn:active{background:var(--border);}

/* ── Canvas ── */
#canvas{
  position:fixed;top:0;left:0;
  width:100%;height:100%;
  touch-action:none;
}

/* ── Filter bar ── */
#filters {
  position:fixed;
  bottom:82px;left:50%;transform:translateX(-50%);
  display:flex;gap:6px;
  background:var(--nav-bg);
  border:1px solid var(--border);
  border-radius:22px;padding:5px 8px;
  backdrop-filter:blur(20px);
  z-index:50;white-space:nowrap;
}
.chip {
  padding:5px 14px;border-radius:14px;
  font-size:12px;font-weight:600;
  color:var(--text-muted);cursor:pointer;
  transition:all .2s;user-select:none;
}
.chip.on{background:var(--accent);color:#fff;}

/* ── Bottom Nav ── */
#nav {
  position:fixed;bottom:0;left:0;right:0;height:72px;
  background:var(--nav-bg);
  border-top:1px solid var(--border);
  backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:space-around;
  padding:0 10px 8px;z-index:50;
}
.nav-item {
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;color:var(--text-muted);font-size:10px;font-weight:500;
  transition:color .2s;padding:4px 12px;
}
.nav-item.on{color:var(--accent);}
.nav-item svg{flex-shrink:0;}

/* ── Overlay ── */
#overlay {
  position:fixed;inset:0;
  background:rgba(0,0,0,0.55);
  opacity:0;pointer-events:none;
  transition:opacity .3s;z-index:60;
}
#overlay.on{opacity:1;pointer-events:all;}

/* ── Profile Panel ── */
#panel {
  position:fixed;bottom:0;left:0;right:0;
  height:72vh;
  background:var(--bg);
  border-top-left-radius:24px;border-top-right-radius:24px;
  border-top:1px solid var(--border);
  transform:translateY(100%);
  transition:transform .4s cubic-bezier(.32,.72,0,1);
  z-index:70;display:flex;flex-direction:column;
}
#panel.on{transform:translateY(0);}
.panel-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0;flex-shrink:0;}
#panel-scroll{flex:1;overflow-y:auto;padding:16px 20px 32px;}
#panel-scroll::-webkit-scrollbar{width:3px;}
#panel-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* ── Panel internals ── */
.p-header{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.p-avatar-wrap{position:relative;flex-shrink:0;}
.p-avatar{
  width:62px;height:62px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:700;color:#fff;
}
.p-story-ring{
  position:absolute;inset:-3px;border-radius:50%;
  background:conic-gradient(#a78bfa,#60a5fa,#34d399,#f59e0b,#f472b6,#a78bfa);
}
.p-story-gap{
  position:absolute;inset:-1px;border-radius:50%;
  border:2px solid var(--bg);z-index:1;
}
.p-avatar{position:relative;z-index:2;}
.p-name{font-size:18px;font-weight:700;}
.badge{
  display:inline-block;padding:2px 10px;border-radius:10px;
  font-size:11px;font-weight:600;margin-top:4px;
}
.b1{background:rgba(167,139,250,.2);color:#a78bfa;}
.b2{background:rgba(96,165,250,.2);color:#60a5fa;}
.b3{background:rgba(148,163,184,.2);color:#94a3b8;}
.bg{background:rgba(52,211,153,.2);color:#34d399;}
.p-bio{font-size:12px;color:var(--text-muted);margin-top:5px;}
.p-mutual{font-size:12px;color:var(--text-muted);margin-bottom:14px;}
.p-actions{display:flex;gap:10px;margin-bottom:18px;}
.btn{
  flex:1;padding:10px;border-radius:12px;
  font-size:13px;font-weight:600;border:none;cursor:pointer;transition:opacity .2s;
}
.btn:active{opacity:.75;}
.btn-pri{background:var(--accent);color:#fff;}
.btn-sec{background:var(--surface);color:var(--text);border:1px solid var(--border);}
.p-section-label{
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  color:var(--text-muted);margin-bottom:8px;
  display:flex;align-items:center;gap:8px;
}
.lim-tag{background:rgba(167,139,250,.15);color:#a78bfa;padding:2px 7px;border-radius:6px;font-size:10px;}
.posts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-bottom:16px;}
.post-cell{
  aspect-ratio:1;border-radius:6px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
}
.locked-wall{
  display:flex;flex-direction:column;align-items:center;
  gap:8px;padding:28px 16px;text-align:center;color:var(--text-muted);
}
.locked-wall .lock-icon{font-size:36px;}
.locked-wall strong{color:var(--text);}
.members-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;}
.member-chip{
  background:var(--surface);border:1px solid var(--border);
  padding:4px 13px;border-radius:20px;font-size:13px;
}
</style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div class="logo">bubble</div>
  <div class="hdr-icons">
    <div class="icon-btn" id="themeBtn">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </div>
    <div class="icon-btn">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>

</div>

<!-- Canvas -->
<canvas id="canvas"></canvas>

<!-- Filters -->
<div id="filters">
  <div class="chip on" data-f="all">All</div>
  <div class="chip" data-f="frequent">Frequent</div>
  <div class="chip" data-f="recent">Recent</div>
  <div class="chip" data-f="groups">Groups</div>
</div>

<!-- Bottom Nav -->
<div id="nav">
  <div class="nav-item on">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg>
    Graph
  </div>
  <div class="nav-item">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    Messages
  </div>
  <div class="nav-item">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    Post
  </div>
  <div class="nav-item">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    Discover
  </div>
  <div class="nav-item">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Profile
  </div>
</div>

<!-- Backdrop -->
<div id="overlay"></div>

<!-- Profile Panel -->
<div id="panel">
  <div class="panel-handle"></div>
  <div id="panel-scroll"></div>
</div>

<script>
// ── DATA ─────────────────────────────────────────────────────────────────────
const NODES = [
  { id:'you',      label:'You',           type:'self',    degree:0, msgFreq:1.00, color:'#ffffff', hasStory:false },
  { id:'emma',     label:'Emma',          type:'contact', degree:1, msgFreq:0.92, color:'#a78bfa', hasStory:true,  mutuals:3, via:null,           bio:'photographer & coffee addict ☕', posts:['#a78bfa','#7c6fff','#c4b5fd','#ddd6fe','#ede9fe','#f5f3ff'] },
  { id:'alex',     label:'Alex',          type:'contact', degree:1, msgFreq:0.71, color:'#f472b6', hasStory:true,  mutuals:2, via:null,           bio:'music & late nights',             posts:['#f472b6','#ec4899','#f9a8d4','#fce7f3'] },
  { id:'jordan',   label:'Jordan',        type:'contact', degree:1, msgFreq:0.55, color:'#fb923c', hasStory:false, mutuals:1, via:null,           bio:'just vibing',                     posts:['#fb923c','#f97316','#fdba74'] },
  { id:'priya',    label:'Priya',         type:'contact', degree:1, msgFreq:0.28, color:'#34d399', hasStory:false, mutuals:2, via:null,           bio:'plant mum 🌿',                    posts:['#34d399','#10b981','#6ee7b7','#a7f3d0'] },
  { id:'squad',    label:'Weekend\nSquad',type:'group',   degree:1, msgFreq:0.85, color:'#34d399', hasStory:false, members:['Emma','Alex','Jordan','You'],   posts:['#34d399','#10b981','#6ee7b7'] },
  { id:'bookclub', label:'Book\nClub',    type:'group',   degree:1, msgFreq:0.42, color:'#34d399', hasStory:false, members:['Priya','Jordan','You','Taylor'],posts:['#6ee7b7','#34d399'] },
  { id:'chris',    label:'Chris',         type:'contact', degree:2, msgFreq:0,    color:'#60a5fa', hasStory:true,  mutuals:1, via:'Emma',         bio:'📍 London',                       posts:['#60a5fa','#3b82f6'] },
  { id:'taylor',   label:'Taylor',        type:'contact', degree:2, msgFreq:0,    color:'#818cf8', hasStory:false, mutuals:2, via:'Alex',         bio:'design & coffee',                 posts:['#818cf8','#6366f1'] },
  { id:'sam',      label:'Sam',           type:'contact', degree:2, msgFreq:0,    color:'#38bdf8', hasStory:false, mutuals:1, via:'Weekend Squad',bio:'',                                posts:['#38bdf8','#0ea5e9'] },
  { id:'morgan',   label:'Morgan',        type:'contact', degree:3, msgFreq:0,    color:'#94a3b8', hasStory:false, mutuals:0, via:'Chris',        bio:'',                                posts:[] },
  { id:'riley',    label:'Riley',         type:'contact', degree:3, msgFreq:0,    color:'#94a3b8', hasStory:false, mutuals:0, via:'Taylor',       bio:'',                                posts:[] },
];

const EDGES = [
  ['you','emma'],['you','alex'],['you','jordan'],['you','priya'],
  ['you','squad'],['you','bookclub'],
  ['emma','alex'],['emma','jordan'],
  ['squad','emma'],['squad','alex'],['squad','jordan'],
  ['bookclub','priya'],['bookclub','jordan'],['bookclub','taylor'],
  ['emma','chris'],['alex','taylor'],['squad','sam'],
  ['chris','morgan'],['taylor','riley'],
];

// ── CANVAS SETUP ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
let W, H, CX, CY, SCALE, DPR;

function resize() {
  DPR   = window.devicePixelRatio || 1;
  W     = window.innerWidth;
  H     = window.innerHeight;
  canvas.width  = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(DPR, DPR);
  CX    = W / 2;
  CY    = 56 + (H - 56 - 72) / 2;
  SCALE = Math.min(W, H) / 420;
  placeNodes();
}
window.addEventListener('resize', resize);

// ── NODE PLACEMENT ────────────────────────────────────────────────────────────
const BUBBLE_R = () => 132 * SCALE;

function placeNodes() {
  const br = BUBBLE_R();
  const byDeg = {1:[], 2:[], 3:[]};
  NODES.forEach(n => { if (n.degree >= 1 && n.degree <= 3) byDeg[n.degree].push(n); });

  [1,2,3].forEach(deg => {
    const list = byDeg[deg];
    list.forEach((n, i) => {
      if (n._angle === undefined) n._angle = (i / list.length) * Math.PI * 2 + deg * 0.4;
      const r = deg === 1 ? br * (0.34 + (1 - n.msgFreq) * 0.48)
              : deg === 2 ? br * (1.18 + i * 0.08)
              :              br * (1.65 + i * 0.07);
      n._tx = Math.cos(n._angle) * r;
      n._ty = Math.sin(n._angle) * r;
      if (n._x === undefined) { n._x = n._tx * 0.7; n._y = n._ty * 0.7; n._s = 0; n._a = 0; }
    });
  });

  const self = NODES[0];
  self._x = self._tx = 0; self._y = self._ty = 0; self._s = 1; self._a = 1;
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function nodeR(n) {
  if (n.type === 'self')    return 26 * SCALE;
  if (n.type === 'group')   return 17 * SCALE;
  if (n.degree === 1)       return (12 + n.msgFreq * 5) * SCALE;
  if (n.degree === 2)       return 11 * SCALE;
  return 9 * SCALE;
}

function lighten(hex, amt) {
  const r = Math.min(255, parseInt(hex.slice(1,3),16) + amt);
  const g = Math.min(255, parseInt(hex.slice(3,5),16) + amt);
  const b = Math.min(255, parseInt(hex.slice(5,7),16) + amt);
  return `rgb(${r},${g},${b})`;
}

function wx(x) { return CX + x + panX; }
function wy(y) { return CY + y + panY; }

// ── DRAW NODES ────────────────────────────────────────────────────────────────
const T0 = Date.now();

function drawNode(n, t) {
  if (!n._a || n._a <= 0) return;
  const sx = wx(n._x), sy = wy(n._y);
  const r  = nodeR(n) * n._s;
  const dark = document.documentElement.dataset.theme === 'dark';
  ctx.save();
  ctx.globalAlpha = n._a;

  // — Story ring —
  if (n.hasStory) {
    const hr = (t * 25) % 360;
    for (let i = 0; i < 36; i++) {
      const a1 = (i/36)*Math.PI*2 - Math.PI/2;
      const a2 = ((i+1)/36)*Math.PI*2 - Math.PI/2;
      ctx.beginPath();
      ctx.arc(sx, sy, r + 5*SCALE, a1, a2);
      ctx.strokeStyle = `hsl(${(hr + i*10)%360},80%,65%)`;
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
  }

  // — Activity glow (1st degree, high freq) —
  if (n.degree === 1 && n.msgFreq > 0.6) {
    const pulse = 0.5 + 0.5 * Math.sin(t * 1.5 + n.id.charCodeAt(0));
    const gr = ctx.createRadialGradient(sx,sy,r,sx,sy,r + (8+pulse*4)*SCALE);
    gr.addColorStop(0, n.color + '55');
    gr.addColorStop(1, n.color + '00');
    ctx.beginPath(); ctx.arc(sx,sy,r+(8+pulse*4)*SCALE,0,Math.PI*2);
    ctx.fillStyle = gr; ctx.fill();
  }

  // — Node body —
  if (n.type === 'self') {
    const gr = ctx.createRadialGradient(sx-r*.3,sy-r*.3,0,sx,sy,r);
    gr.addColorStop(0,'#ffffff'); gr.addColorStop(.5,'#e0d7ff'); gr.addColorStop(1,'#a78bfa');
    ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2);
    ctx.fillStyle = gr; ctx.fill();
    const sg = ctx.createLinearGradient(sx-r,sy-r,sx+r,sy+r);
    sg.addColorStop(0,'#a78bfa'); sg.addColorStop(.5,'#60a5fa'); sg.addColorStop(1,'#34d399');
    ctx.strokeStyle = sg; ctx.lineWidth = 2; ctx.stroke();

  } else if (n.type === 'group') {
    const gr = ctx.createRadialGradient(sx-r*.3,sy-r*.3,0,sx,sy,r);
    gr.addColorStop(0,'#6ee7b7'); gr.addColorStop(1,'#059669');
    ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2);
    ctx.fillStyle = gr; ctx.fill();
    ctx.strokeStyle = '#34d399'; ctx.lineWidth = 1.5; ctx.stroke();

  } else if (n.degree === 1) {
    const gr = ctx.createRadialGradient(sx-r*.3,sy-r*.3,0,sx,sy,r);
    gr.addColorStop(0, lighten(n.color,50)); gr.addColorStop(1, n.color);
    ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2);
    ctx.fillStyle = gr; ctx.fill();

  } else if (n.degree === 2) {
    ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2);
    ctx.fillStyle = dark ? '#1e293b' : '#cbd5e1'; ctx.fill();
    ctx.strokeStyle = n.color + '99'; ctx.lineWidth = 2; ctx.stroke();
    // mutual badge
    if (n.mutuals > 0 && n._s > 0.8) {
      const bx = sx + r*.7, by = sy - r*.7;
      ctx.beginPath(); ctx.arc(bx,by,7*SCALE,0,Math.PI*2);
      ctx.fillStyle = '#60a5fa'; ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${7*SCALE}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.globalAlpha = n._a; ctx.fillText(n.mutuals, bx, by+.5);
    }

  } else { // degree 3 — ghost
    ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2);
    ctx.fillStyle = dark ? 'rgba(30,41,59,.55)' : 'rgba(203,213,225,.55)'; ctx.fill();
    ctx.setLineDash([3,3]);
    ctx.strokeStyle = dark ? 'rgba(148,163,184,.4)' : 'rgba(100,116,139,.4)';
    ctx.lineWidth = 1; ctx.stroke(); ctx.setLineDash([]);
  }

  // — Initials / icons —
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (n.type === 'self') {
    ctx.fillStyle = dark ? 'rgba(0,0,0,.7)' : 'rgba(0,0,0,.6)';
    ctx.font = `bold ${11*SCALE}px -apple-system,sans-serif`;
    ctx.fillText('You', sx, sy+.5);
  } else if (n.degree === 1) {
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.font = `bold ${r*.65}px -apple-system,sans-serif`;
    ctx.fillText(n.label[0], sx, sy+.5);
  } else if (n.degree === 3) {
    ctx.font = `${r}px sans-serif`;
    ctx.fillText('🔒', sx, sy+1);
  }

  // — Label —
  if (n.type !== 'self' && n._s > 0.5) {
    const lines = n.label.split('\n');
    const ly = sy + r + 5*SCALE;
    ctx.globalAlpha = n._a * Math.min(1,(n._s-.5)*2);
    ctx.font = `${(n.degree===3?9:10)*SCALE}px -apple-system,sans-serif`;
    ctx.textBaseline = 'top';
    ctx.fillStyle = n.degree === 3
      ? (dark ? 'rgba(148,163,184,.5)' : 'rgba(100,116,139,.5)')
      : (dark ? 'rgba(255,255,255,.75)' : 'rgba(0,0,0,.7)');
    lines.forEach((l,i) => ctx.fillText(l, sx, ly + i*11*SCALE));
  }

  ctx.restore();
}

// ── DRAW EDGES ────────────────────────────────────────────────────────────────
function drawEdges(visible) {
  const dark = document.documentElement.dataset.theme === 'dark';
  EDGES.forEach(([a,b]) => {
    const n1 = NODES.find(n=>n.id===a), n2 = NODES.find(n=>n.id===b);
    if (!n1||!n2||!visible.has(a)||!visible.has(b)) return;
    if ((!n1._a||n1._a<.05) && n1.type!=='self') return;
    if ((!n2._a||n2._a<.05) && n2.type!=='self') return;
    const alpha = Math.min(n1._a||1, n2._a||1);
    const isGroup = n1.type==='group'||n2.type==='group';
    const is1st   = (n1.degree<=1||n1.type==='self')&&(n2.degree<=1||n2.type==='self');
    let color, lw;
    if (isGroup) { color=`rgba(52,211,153,${.35*alpha})`; lw=1.5; }
    else if (is1st) { color=`rgba(167,139,250,${.25*alpha})`; lw=1.5; }
    else { color=`rgba(148,163,184,${.14*alpha})`; lw=1; }
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(wx(n1._x), wy(n1._y));
    ctx.lineTo(wx(n2._x), wy(n2._y));
    ctx.strokeStyle = color; ctx.lineWidth = lw;
    if (!is1st && !isGroup) ctx.setLineDash([4,5]);
    ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
  });
}

// ── BUBBLE MEMBRANE ───────────────────────────────────────────────────────────
function drawBubble(t) {
  const br   = BUBBLE_R();
  const sx   = wx(0), sy = wy(0);
  const dark = document.documentElement.dataset.theme === 'dark';

  // Soft inner fill
  const fill = ctx.createRadialGradient(sx,sy,0,sx,sy,br);
  fill.addColorStop(0,   dark ? 'rgba(167,139,250,.04)' : 'rgba(167,139,250,.07)');
  fill.addColorStop(.65, dark ? 'rgba(96,165,250,.04)'  : 'rgba(96,165,250,.06)');
  fill.addColorStop(1,   dark ? 'rgba(52,211,153,.07)'  : 'rgba(52,211,153,.10)');
  ctx.beginPath(); ctx.arc(sx,sy,br,0,Math.PI*2);
  ctx.fillStyle = fill; ctx.fill();

  // Iridescent ring — 3 layered passes
  const hShift = (t * 38) % 360;
  for (let pass = 0; pass < 3; pass++) {
    const offset = pass * 2.2;
    const alpha  = .55 - pass * .14;
    const seg    = 60;
    for (let i = 0; i < seg; i++) {
      const a1  = (i/seg)*Math.PI*2;
      const a2  = ((i+1)/seg)*Math.PI*2;
      const hue = (hShift + (i/seg)*360 + pass*30) % 360;
      const sat = 68 + Math.sin(i*.4 + t*1.8) * 18;
      const lit = dark ? 64 : 54;
      const a   = alpha * (.7 + Math.sin(i*.35 + t*1.1)*.3);
      ctx.beginPath();
      ctx.arc(sx, sy, br - offset, a1, a2);
      ctx.strokeStyle = `hsla(${hue},${sat}%,${lit}%,${a})`;
      ctx.lineWidth   = 3 - pass * .6;
      ctx.stroke();
    }
  }

  // Outer glow halo
  const hue0  = (hShift) % 360;
  const glow  = ctx.createRadialGradient(sx,sy,br-8,sx,sy,br+22);
  glow.addColorStop(0,   'rgba(0,0,0,0)');
  glow.addColorStop(.4,  `hsla(${hue0},70%,70%,.09)`);
  glow.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.beginPath(); ctx.arc(sx,sy,br+22,0,Math.PI*2);
  ctx.fillStyle = glow; ctx.fill();
}

// ── MAIN LOOP ─────────────────────────────────────────────────────────────────
let panX = 0, panY = 0;
let activeFilter = 'all';
let entryStart = Date.now();
const ENTRY_STAGGER = 120;

function getVisible() {
  return new Set(NODES.filter(n => {
    if (n.type==='self') return true;
    if (activeFilter==='frequent') return n.msgFreq > 0.5;
    if (activeFilter==='recent')   return n.degree === 1;
    if (activeFilter==='groups')   return n.type === 'group';
    return true;
  }).map(n=>n.id));
}

function loop() {
  requestAnimationFrame(loop);
  const t  = (Date.now() - T0) / 1000;
  const el = Date.now() - entryStart;
  const dark = document.documentElement.dataset.theme === 'dark';

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = dark ? '#080810' : '#f0f0f8';
  ctx.fillRect(0,0,W,H);

  // Entry spring
  let idx = 0;
  NODES.forEach(n => {
    if (n.type==='self') return;
    const delay = 400 + idx * ENTRY_STAGGER + n.degree * 150;
    idx++;
    if (el > delay) {
      n._x += (n._tx - n._x) * .09;
      n._y += (n._ty - n._y) * .09;
      n._s  = Math.min(1, (n._s||0) + .055);
      n._a  = Math.min(1, (n._a||0) + .045);
    }
  });

  const vis = getVisible();
  drawBubble(t);
  drawEdges(vis);
  [3,2,1].forEach(d => NODES.filter(n=>n.degree===d&&vis.has(n.id)).forEach(n=>drawNode(n,t)));
  drawNode(NODES[0], t);
}

// ── FILTER CHIPS ──────────────────────────────────────────────────────────────
document.querySelectorAll('.chip').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
    activeFilter = c.dataset.f;
  });
});

// ── THEME TOGGLE ──────────────────────────────────────────────────────────────
document.getElementById('themeBtn').addEventListener('click', () => {
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
});

// ── HIT TEST ─────────────────────────────────────────────────────────────────
function nodeAt(sx, sy) {
  const vis = getVisible();
  // check front-to-back: self, deg1, deg2, deg3
  const order = [NODES[0], ...NODES.filter(n=>n.degree===1), ...NODES.filter(n=>n.degree===2), ...NODES.filter(n=>n.degree===3)];
  for (const n of order) {
    if (!vis.has(n.id)) continue;
    const dx = sx - wx(n._x), dy = sy - wy(n._y);
    if (dx*dx + dy*dy < Math.pow(nodeR(n)*1.5, 2)) return n;
  }
  return null;
}

// ── PAN + TAP (touch) ────────────────────────────────────────────────────────
let _tx0, _ty0, _px0, _py0, _moved;
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  _tx0 = t.clientX; _ty0 = t.clientY;
  _px0 = panX; _py0 = panY; _moved = false;
}, {passive:true});

canvas.addEventListener('touchmove', e => {
  const t = e.touches[0];
  const dx = t.clientX - _tx0, dy = t.clientY - _ty0;
  if (Math.abs(dx)>6 || Math.abs(dy)>6) _moved = true;
  panX = _px0 + dx; panY = _py0 + dy;
}, {passive:true});

canvas.addEventListener('touchend', e => {
  if (_moved) return;
  const t = e.changedTouches[0];
  const n = nodeAt(t.clientX, t.clientY);
  if (n) openPanel(n);
});

// ── PAN + CLICK (mouse) ───────────────────────────────────────────────────────
let _mx0, _my0, _mpx, _mpy, _mdragged;
canvas.addEventListener('mousedown', e => {
  _mx0 = e.clientX; _my0 = e.clientY;
  _mpx = panX; _mpy = panY; _mdragged = false;
});
canvas.addEventListener('mousemove', e => {
  if (!(e.buttons & 1)) return;
  const dx = e.clientX-_mx0, dy = e.clientY-_my0;
  if (Math.abs(dx)>4||Math.abs(dy)>4) _mdragged = true;
  panX = _mpx + dx; panY = _mpy + dy;
});
canvas.addEventListener('click', e => {
  if (_mdragged) return;
  const n = nodeAt(e.clientX, e.clientY);
  if (n) openPanel(n); else closePanel();
});

// ── PANEL OPEN/CLOSE ──────────────────────────────────────────────────────────
const panel   = document.getElementById('panel');
const pscroll = document.getElementById('panel-scroll');
const overlay = document.getElementById('overlay');

function openPanel(n) {
  pscroll.innerHTML = buildPanel(n);
  panel.classList.add('on');
  overlay.classList.add('on');
}
function closePanel() {
  panel.classList.remove('on');
  overlay.classList.remove('on');
}
overlay.addEventListener('click', closePanel);

// ── PROFILE PANEL BUILDER ─────────────────────────────────────────────────────
function avatar(n, size=62) {
  const c = n.type==='group' ? '#34d399' : n.color;
  const story = n.hasStory ? `
    <div class="p-story-ring"></div>
    <div class="p-story-gap"></div>` : '';
  return `
    <div class="p-avatar-wrap">
      ${story}
      <div class="p-avatar" style="width:${size}px;height:${size}px;font-size:${size*.38}px;background:linear-gradient(135deg,${lightenCSS(c,45)},${c})">
        ${n.label[0]}
      </div>
    </div>`;
}

function lightenCSS(hex, amt) {
  const r=Math.min(255,parseInt(hex.slice(1,3),16)+amt);
  const g=Math.min(255,parseInt(hex.slice(3,5),16)+amt);
  const b=Math.min(255,parseInt(hex.slice(5,7),16)+amt);
  return `rgb(${r},${g},${b})`;
}

function postGrid(posts, limit, locked) {
  if (!posts || posts.length===0) return '';
  const label = locked
    ? `<div class="p-section-label">Featured <span class="lim-tag">LIMITED</span></div>`
    : `<div class="p-section-label">Posts</div>`;
  const cells = [];
  for (let i=0; i<6; i++) {
    if (i < limit && posts[i]) {
      cells.push(`<div class="post-cell" style="background:linear-gradient(135deg,${posts[i]}33,${posts[i]}77);border:1px solid ${posts[i]}44"></div>`);
    } else {
      cells.push(`<div class="post-cell" style="background:var(--surface);border:1px solid var(--border)">🔒</div>`);
    }
  }
  return `${label}<div class="posts-grid">${cells.join('')}</div>`;
}

function buildPanel(n) {
  // ── Self ──
  if (n.type === 'self') {
    return `
      <div class="p-header">
        ${avatar(n)}
        <div>
          <div class="p-name">You</div>
          <span class="badge b1">Your Profile</span>
        </div>
      </div>
      <div class="p-actions">
        <button class="btn btn-pri">Edit Profile</button>
        <button class="btn btn-sec">Settings</button>
      </div>
      ${postGrid(['#a78bfa','#60a5fa','#34d399','#f472b6','#fb923c','#38bdf8'], 6, false)}`;
  }

  // ── Group ──
  if (n.type === 'group') {
    const members = (n.members||[]).map(m=>`<div class="member-chip">${m}</div>`).join('');
    return `
      <div class="p-header">
        ${avatar(n)}
        <div>
          <div class="p-name">${n.label.replace('\n',' ')}</div>
          <span class="badge bg">Group · ${n.members?.length||0} members</span>
          <div class="p-bio">${n.bio||''}</div>
        </div>
      </div>
      <div class="p-actions">
        <button class="btn btn-pri">💬 Open Chat</button>
        <button class="btn btn-sec">👥 Members</button>
      </div>
      <div class="p-section-label">Members</div>
      <div class="members-wrap">${members}</div>
      ${postGrid(n.posts, 6, false)}`;
  }

  // ── 1st degree ──
  if (n.degree === 1) {
    const mutLine = n.mutuals>0
      ? `<div class="p-mutual">🔗 ${n.mutuals} mutual connection${n.mutuals>1?'s':''}</div>` : '';
    return `
      <div class="p-header">
        ${avatar(n)}
        <div>
          <div class="p-name">${n.label}</div>
          <span class="badge b1">1st degree</span>
          <div class="p-bio">${n.bio||''}</div>
        </div>
      </div>
      ${mutLine}
      <div class="p-actions">
        <button class="btn btn-pri">💬 Message</button>
        <button class="btn btn-sec">Following ✓</button>
      </div>
      ${postGrid(n.posts, 6, false)}`;
  }

  // ── 2nd degree ──
  if (n.degree === 2) {
    const mutLine = `<div class="p-mutual">🔗 ${n.mutuals} mutual connection${n.mutuals!==1?'s':''} · via ${n.via}</div>`;
    return `
      <div class="p-header">
        ${avatar(n)}
        <div>
          <div class="p-name">${n.label}</div>
          <span class="badge b2">2nd degree</span>
          <div class="p-bio">${n.bio||''}</div>
        </div>
      </div>
      ${mutLine}
      <div class="p-actions">
        <button class="btn btn-sec" style="flex:.8">💬 Message</button>
        <button class="btn btn-pri">+ Follow</button>
      </div>
      ${postGrid(n.posts, 3, true)}`;
  }

  // ── 3rd degree ──
  return `
    <div class="p-header">
      ${avatar(n)}
      <div>
        <div class="p-name">${n.label}</div>
        <span class="badge b3">3rd degree</span>
        <div class="p-bio">Connected via ${n.via}</div>
      </div>
    </div>
    <div class="locked-wall">
      <div class="lock-icon">🔒</div>
      <strong>Private Profile</strong>
      <div style="font-size:13px">Follow ${n.via} first, then send a request to connect</div>
    </div>
    <div class="p-actions" style="margin-top:8px">
      <button class="btn btn-pri" style="flex:1">📨 Request to Follow</button>
    </div>`;
}

// ── BOOT ─────────────────────────────────────────────────────────────────────
resize();
loop();
</script>
</body>
</html>
